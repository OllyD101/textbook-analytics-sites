<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --hessle:#c8202f;--bat:#d63a46;--bowl:#3d7fe0;--field:#2fa35a;--turf:#13261b;--turf2:#16301f;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;}
a{color:inherit;}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid #8db8f2;outline-offset:2px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px;}
/* header */
.top{background:linear-gradient(180deg,#2a0d10,#1a0a0c);border-bottom:2px solid var(--hessle);position:sticky;top:0;z-index:20;}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px;}
.top{padding-top:env(safe-area-inset-top,0px);}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));}
#install-btn{background:var(--hessle);border-color:var(--hessle);color:#fff;font-weight:700;}
.brand,.acct{white-space:nowrap;}
@media (max-width:560px){ .top .wrap{gap:10px;} .top img{height:36px;} .brand{font-size:1.2rem;} .acct{padding:5px 9px;font-size:.8rem;} }
.top img{height:42px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
.brand{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:1px;line-height:1;}
.brand span{color:#f0717b;}
.top-links{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem;}
.top-links a{color:var(--muted);text-decoration:none;}
.top-links a:hover{color:var(--text);}
.acct{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;}
.demo-bar{background:#1d2b42;border-bottom:1px solid #2c4366;font-size:.85rem;color:#c9d8ee;}
.demo-bar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;}
.demo-bar button{margin-left:auto;}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0 16px;overflow-x:auto;}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--hessle);}
/* generic */
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;}
.btn:hover{border-color:var(--muted);}
.btn-red{background:var(--hessle);border-color:var(--hessle);color:#fff;}
.btn-red:hover{background:#d8303f;border-color:#d8303f;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.muted{color:var(--muted);}
.hint{font-size:.82rem;color:var(--muted);}
input[type=text],input[type=email],input[type=password],input[type=search],select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;outline:none;width:100%;}
input:focus,select:focus{border-color:var(--hessle);box-shadow:0 0 0 2px rgba(200,32,47,.2);}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;}
.pos-WK{background:rgba(47,163,90,.18);color:#7fd6a0;} .pos-BAT{background:rgba(214,58,70,.18);color:#f08a92;}
.pos-AR{background:rgba(200,32,47,.14);color:#f0b2b8;} .pos-BOWL{background:rgba(61,127,224,.18);color:#8db8f2;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--field);
  border-radius:10px;padding:12px 16px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:50;max-width:min(560px,92vw);display:none;}
.toast.err{border-left-color:var(--bat);} .toast.show{display:block;}

.auth h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:2.2rem;letter-spacing:1px;margin:0 0 4px;}
.auth form{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.auth label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;}

table.league{width:100%;border-collapse:collapse;}

<script>
// ============================================================ rules (mirrors the database)
const RULES = {
  squad: { WK: 1, BAT: 4, AR: 2, BOWL: 4 }, bench: 3, budget: 100, freeTransfers: 2, hit: 4,
  points: [
    ['Batting', [['Each run', 1], ['Each six', '+2'], ['Fifty', '+10'], ['Hundred', '+20'], ['Duck', -8]]],
    ['Bowling', [['Each wicket', 12], ['Maiden', '+4'], ['4-wicket haul', '+8'], ['5-wicket haul', '+16']]],
    ['Fielding', [['Catch', 5], ['Stumping', 8], ['Run-out', 10], ['3+ catches in a match', '+4']]],
    ['Bonuses', [['Man of the Match', '+10'], ['On the winning team', '+3']]]
  ]
};
const POS_NAME = { WK: 'Wicketkeeper', BAT: 'Batter', AR: 'All-rounder', BOWL: 'Bowler' };
const CHIP_NAME = { triple: 'Triple Captain', bench: 'Bench Boost' };
const move = n => { const m = S.priceMove && S.priceMove[n]; return m ? `<span class="pmove ${m > 0 ? 'up' : 'down'}">${m > 0 ? '▲' : '▼'}${Math.abs(m).toFixed(1)}</span>` : ''; };
const POS_ORDER = ['WK', 'BAT', 'AR', 'BOWL'];
const PART_NAME = { runs: 'runs', sixes: 'sixes', fifty: 'fifty', hundred: 'hundred', duck: 'duck', wickets: 'wickets', maidens: 'maidens',
  four_wkts: '4-wicket haul', five_wkts: '5-wicket haul', catches: 'catches', stumpings: 'stumpings', run_outs: 'run-outs',
  three_catches: '3+ catches', motm: 'Man of the Match', win: 'win bonus' };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const money = v => '£' + Number(v).toFixed(1) + 'm';

// ============================================================ state
const S = { players: [], byName: {}, gws: [], points: {}, session: null, manager: null, entries: [], draft: null,
  view: 'team', filter: 'ALL', search: '', sort: 'price', authMode: 'signin', saving: false };

// ============================================================ shared scoring (same as the database view)
function entryForGw(entries, gw) { let e = null; for (const x of entries) if (x.gw <= gw && (!e || x.gw > e.gw)) e = x; return e; }
// Auto-subs: each starter who didn't play is replaced by the first sub (bench order) of the same position who did.
function effectiveEleven(e, P) {
  const out = e.players.slice(), used = new Set(), subs = {};
  e.players.forEach((p, i) => {
    if (P[p]) return;
    const pos = (S.byName[p] || {}).position;
    const sub = (e.bench || []).find(b => !used.has(b) && P[b] && (S.byName[b] || {}).position === pos);
    if (sub) { out[i] = sub; used.add(sub); subs[p] = sub; }
  });
  return { eleven: out, subs };
}
function scoreEntry(e, gw, pts) {
  if (!e) return null;
  const P = pts[gw] || {};
  const chip = e.gw === gw ? (e.chip || null) : null;
  const { eleven, subs } = chip === 'bench' ? { eleven: e.players.concat(e.bench || []), subs: {} } : effectiveEleven(e, P);
  let total = 0; for (const p of eleven) total += (P[p] ? P[p].points : 0);
  const doubled = P[e.captain] ? e.captain : (P[e.vice] ? e.vice : null);
  if (doubled) total += P[doubled].points * (chip === 'triple' ? 2 : 1);
  const hit = e.gw === gw ? (e.hit || 0) : 0;
  return { gw, points: total - hit, doubled, hit, subs, chip };
}
function scoredGws(now) { return S.gws.filter(g => new Date(g.deadline) <= now && S.points[g.gw] && Object.keys(S.points[g.gw]).length).map(g => g.gw); }
function budgetLimit() {   // £100m, or your current squad's value at today's prices if that's higher
  const ng = nextGw(); if (!ng) return RULES.budget;
  const prev = entryForGw(S.entries.filter(e => e.gw < ng.gw), ng.gw); if (!prev) return RULES.budget;
  const v = prev.players.concat(prev.bench || []).reduce((t, p) => t + (S.byName[p] ? S.byName[p].price : 0), 0);
  return Math.max(RULES.budget, Math.round(v * 10) / 10);
}
function checkTeam(t) {
  const errs = [], ps = t.players || [], bench = t.bench || [], all = ps.concat(bench);
  if (ps.length !== 11) errs.push(`Pick 11 starters (you have ${ps.length}).`);
  if (bench.length !== RULES.bench) errs.push(`Pick ${RULES.bench} subs (you have ${bench.length}).`);

}

function dbProblem(e) {
  const m = (e && (e.message || e.hint || e.code)) || String(e);
  const all = m + ' ' + ((e && e.code) || '');
  if (/could not query the database|PGRST00[0-3]|503|connection/i.test(all)) return 'Supabase is starting up or the project is paused. Wait a minute and refresh — if it keeps happening, open the project in Supabase and press “Restore project”.';
  if (/could not find the table|does not exist|42P01|PGRST205/i.test(all)) return 'The fantasy tables aren\u2019t set up in Supabase yet. Run supabase_setup.sql in the SQL Editor.';
  if (/JWT|apikey|Invalid API key|401/i.test(m)) return 'Supabase rejected the page\u2019s key. Check the anon key in fantasy.html.';
  return friendly(m);
}
function friendly(m) {
  if (/invalid login/i.test(m)) return 'That email and password don\u2019t match an account.';
  if (/already registered|already been registered/i.test(m)) return 'There\u2019s already an account with that email — sign in instead.';
  if (/password should be|at least 6|weak/i.test(m)) return 'Use a longer password (at least 8 characters).';
  if (/rate limit|too many/i.test(m)) return 'Too many attempts — wait a few minutes and try again.';
  if (/email not confirmed/i.test(m)) return 'Confirm your email first — check your inbox (and spam) for the link.';
  if (/unable to validate email|invalid email/i.test(m)) return 'That doesn\u2019t look like a full email address.';
  if (/failed to fetch|network/i.test(m)) return 'Couldn\u2019t reach the sign-in service. Check your connection and try again.';
  if (/duplicate key.*fantasy_managers/i.test(m)) return 'You already have a team.';
  return m;
}

// ---------------------------------------------------------------- league
async function leagueView() {
  const v = document.getElementById('view'); v.innerHTML = '<div class="empty-state">Loading…</div>';
  const [rows, all] = await Promise.all([API.standings(), API.allScores()]);
  if (!rows.length) { v.innerHTML = '<div class="card empty-state">No teams yet. Be the first.</div>'; return; }
  // positions now vs after the previous gameweek
  const gwsDone = [...new Set(all.map(x => x.gw))].sort(), mv = {};
  if (gwsDone.length > 1) {
    const rankAt = upto => { const t = {}; for (const r of rows) t[r.user_id] = 0; for (const x of all) if (x.gw <= upto && x.user_id in t) t[x.user_id] += x.points;
      const order = Object.entries(t).sort((a, b) => b[1] - a[1]), out = {}; order.forEach(([u, v], i) => out[u] = i && order[i - 1][1] === v ? out[order[i - 1][0]] : i + 1); return out; };
    const now = rankAt(gwsDone[gwsDone.length - 1]), before = rankAt(gwsDone[gwsDone.length - 2]);
    for (const u in now) mv[u] = before[u] - now[u];
  }
  const arrow = u => mv[u] > 0 ? `<span class="mv up" title="Up ${mv[u]} since last week">▲${mv[u]}</span>` : mv[u] < 0 ? `<span class="mv down" title="Down ${-mv[u]} since last week">▼${-mv[u]}</span>` : `<span class="mv same" title="No change">–</span>`;
  const me = S.session && S.session.id;
  v.innerHTML = `<div class="card" style="overflow-x:auto"><table class="league"><thead><tr><th>#</th><th>Team</th><th class="num">This week</th><th class="num">Total</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.user_id === me ? 'me' : ''}" onclick="showTeam('${esc(r.user_id)}','${esc(r.team_name).replace(/'/g, '&#39;')}')"><td>${r.position} ${gwsDone.length > 1 ? arrow(r.user_id) : ''}</td><td><strong>${esc(r.team_name)}</strong><br><small class="muted">${esc(r.manager_name)}</small></td><td class="num">${r.last_week}</td><td class="num"><strong>${r.total}</strong></td></tr>`).join('')}
    </tbody></table></div><p class="hint">Tap a team to see who they picked. Teams are only shown once each gameweek has locked.</p>`;
}

async function playerCard(name) {

    <div class="pc-grid"><div class="pc-stat"><b>${total}</b><small>points this season</small></div><div class="pc-stat"><b>${played.length}</b><small>gameweeks played</small></div>

// ---------------------------------------------------------------- awards: team of the week, manager of the week / month
async function awardsView() {
  const v = document.getElementById('view'); v.innerHTML = '<div class="empty-state">Loading…</div>';
  const [rows, all] = await Promise.all([API.standings(), API.allScores()]);
  const sg = scoredGws(API.now());
  if (!sg.length) { v.innerHTML = '<div class="card empty-state">Awards start after the first Saturday.</div>'; return; }
  S.aw = { rows, all, sg, names: Object.fromEntries(rows.map(r => [r.user_id, r])) };
  if (!S.awGw || !sg.includes(S.awGw)) S.awGw = sg[sg.length - 1];
  drawAwards();
}
function drawAwards() {
  const { all, sg, names } = S.aw, gw = S.awGw, i = sg.indexOf(gw), P = S.points[gw] || {};
  const team = n => names[n] ? `<strong>${esc(names[n].team_name)}</strong> <span class="muted">(${esc(names[n].manager_name)})</span>` : 'Unknown';
  // team of the week
  const best = {}; for (const pos of POS_ORDER) best[pos] = Object.keys(P).filter(p => (S.byName[p] || {}).position === pos).sort((a, b) => P[b].points - P[a].points || a.localeCompare(b)).slice(0, RULES.squad[pos]);
  const totw = Object.values(best).flat(), totwPts = totw.reduce((t, p) => t + P[p].points, 0);
  const slot = (pos, p) => p ? `<button class="slot filled pslot" onclick="playerCard('${esc(p)}')"><div class="nm">${esc(p)}</div><div class="ptsb ${P[p].points >= 40 ? 'hot' : ''}">${P[p].points}</div><div class="pr">${POS_NAME[pos]}</div></button>`
    : `<div class="slot"><span class="empty">No ${POS_NAME[pos].toLowerCase()} played</span></div>`;
  const line = pos => `<div class="line">${Array.from({ length: RULES.squad[pos] }, (_, k) => slot(pos, best[pos][k])).join('')}</div>`;
  // manager of the week
  const week = all.filter(x => x.gw === gw), top = week.length ? Math.max(...week.map(x => x.points)) : null, motw = week.filter(x => x.points === top);
  // manager of the month (calendar month of this gameweek, gameweeks played so far)
  const month = gw.slice(0, 7), monthGws = sg.filter(g => g.slice(0, 7) === month), mt = {};
  for (const x of all) if (monthGws.includes(x.gw)) mt[x.user_id] = (mt[x.user_id] || 0) + x.points;
  const mTop = Object.keys(mt).length ? Math.max(...Object.values(mt)) : null, motm = Object.keys(mt).filter(u => mt[u] === mTop);
  const monthName = m => new Date(m + '-15').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const complete = monthGws.length && S.gws.filter(g => g.gw.slice(0, 7) === month).every(g => sg.includes(g.gw));
  // roll of honour
  const months = [...new Set(sg.map(g => g.slice(0, 7)))], wins = {};
  for (const g of sg) { const w = all.filter(x => x.gw === g); const t = Math.max(...w.map(x => x.points)); w.filter(x => x.points === t).forEach(x => wins[x.user_id] = (wins[x.user_id] || 0) + 1); }
  const roll = months.map(m => { const t = {}; for (const x of all) if (x.gw.slice(0, 7) === m) t[x.user_id] = (t[x.user_id] || 0) + x.points;
    const mx = Math.max(...Object.values(t)); return `<div class="prow"><div>${monthName(m)}${S.gws.filter(g => g.gw.slice(0, 7) === m).every(g => sg.includes(g.gw)) ? '' : ' <span class="hint">(so far)</span>'}<br><small>${Object.keys(t).filter(u => t[u] === mx).map(team).join(', ')}</small></div><div class="num"><b>${mx}</b></div></div>`; }).join('');
  const mostWins = Object.entries(wins).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('view').innerHTML = `
    <div class="gwnav"><button class="btn" onclick="awStep(-1)" ${i === 0 ? 'disabled' : ''} aria-label="Previous gameweek">‹</button>
      <div><strong>Gameweek ${gwNumber(gw)}</strong><div class="hint">${new Date(gw).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</div></div>
      <button class="btn" onclick="awStep(1)" ${i === sg.length - 1 ? 'disabled' : ''} aria-label="Next gameweek">›</button></div>
    <div class="aw-grid">
      <div class="card aw-card"><div class="aw-h">Manager of the Week</div>${motw.length ? motw.map(x => `<div>${team(x.user_id)}</div>`).join('') + `<div class="aw-big">${top} pts</div>` : '<div class="muted">No teams this week</div>'}</div>
      <div class="card aw-card"><div class="aw-h">Manager of the Month · ${monthName(month)}${complete ? '' : ' (so far)'}</div>${motm.length ? motm.map(u => `<div>${team(u)}</div>`).join('') + `<div class="aw-big">${mTop} pts</div>` : '<div class="muted">No teams yet</div>'}</div>
    </div>
    <div class="aw-h" style="margin:16px 0 8px">Team of the Week <span class="hint">· ${totwPts} points between them</span></div>
    <div class="ground pground" aria-label="Team of the Week">${line('WK')}${line('BAT')}${line('AR')}${line('BOWL')}</div>
    <div class="card" style="margin-top:14px"><div class="detail" style="padding:6px 14px"><div class="aw-h" style="padding:8px 0">Roll of honour: Manager of the Month</div>${roll}
      ${mostWins ? `<div class="prow"><div>Most Manager of the Week wins<br><small>${team(mostWins[0])}</small></div><div class="num"><b>${mostWins[1]}</b></div></div>` : ''}</div></div>`;
}
function awStep(d) { const i = S.aw.sg.indexOf(S.awGw) + d; if (i >= 0 && i < S.aw.sg.length) { S.awGw = S.aw.sg[i]; drawAwards(); } }

  if (_installEvent) { _installEvent.prompt(); const r = await _installEvent.userChoice; _installEvent = null; showInstallButton(); return; }
  document.getElementById('modal-body').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>Add Hessle Fantasy to your home screen</strong><button class="btn" onclick="closeModal()" aria-label="Close">✕</button></div>
    <ol class="muted" style="margin:0;padding-left:20px;line-height:1.8"><li>Tap the <strong>Share</strong> button <span aria-hidden="true">(the square with an arrow, at the bottom of Safari)</span>.</li>
    <li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol>
    <p class="hint" style="margin-top:12px">It then opens full-screen like an app, with the club crest as its icon. On an iPhone this only works in <strong>Safari</strong>.</p>`;
  document.getElementById('modal').classList.add('open');
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
showInstallButton();
boot();
</script>
</body>
