name: Update dashboard from Play-Cricket

on:
  schedule:
    # GitHub runs schedules in UTC (UK summer time is UTC+1). Runs can start a few minutes late.
    - cron: "*/30 12-22 * * 6,0"   # every 30 minutes, Saturday and Sunday afternoons and evenings
    - cron: "0 21 * * 1-5"          # once each weekday evening (midweek games, late scorecard edits)
    - cron: "*/30 12-20 * * 1-5"    # weekday afternoons: only goes ahead on a game day (fixtures file, else bank holidays)
  workflow_dispatch:                # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "dry_run = compare only, publish = update the site"
        type: choice
        options: [dry_run, publish]
        default: dry_run
      seasons:
        description: "Seasons to check, e.g. 2026, or a range like 2018-2026 (blank = current season)"
        required: false
      only_teams:
        description: "Only these XIs, e.g. 3rd for the 3rd XI backfill (blank = all XIs)"
        required: false

permissions:
  contents: write                   # needed to commit the updated data files

concurrency:
  group: update-dashboard-data      # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Game day check (weekday afternoon runs only)
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 12-20 * * 1-5" ] && ! python pipeline/fixtures.py --today-has-games; then
            echo "No game today, so this weekday afternoon run stops here."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and convert Play-Cricket scorecards
        if: steps.gate.outputs.go == 'yes'
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
          PLAY_CRICKET_SITE_ID: ${{ vars.PLAY_CRICKET_SITE_ID }}
          # Fantasy cricket (optional): leave unset until the Supabase project exists
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Manual runs use the mode you pick; scheduled runs use the PIPELINE_MODE variable (dry_run until you switch it)
          PIPELINE_MODE: ${{ github.event.inputs.mode || vars.PIPELINE_MODE || 'dry_run' }}
          PIPELINE_SEASONS: ${{ github.event.inputs.seasons }}
          PIPELINE_ONLY_TEAMS: ${{ github.event.inputs.only_teams }}
        run: python pipeline/run.py

      - name: Keep the report
        if: always() && steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: update-report
          path: pipeline/last_report.md
          if-no-files-found: ignore

      - name: Publish changes to the site
        if: success() && steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data.json docs/league.json docs/fantasy-player-stats.json pipeline/state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Update data from Play-Cricket ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
